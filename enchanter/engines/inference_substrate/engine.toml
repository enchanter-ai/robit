name = "inference-substrate"
description = "Advisory post-session engine. Accumulates failure-shaped events into the cross-session evidence substrate (artifacts.jsonl + catalog.json). At post-session: flushes buffered artifacts. At cross-session: reconciles catalog and renders per-plugin briefings."
version = "1.0.0"
phases = ["post-session", "cross-session"]
required = false
budget_tier = "always"
adapter = "enchanter.engines.inference_substrate.adapter:adapter"

[topics]
subscribes = [
    "lifecycle.post-session",
    "lifecycle.cross-session",
    "*.veto",
    "*.warn",
]
emits = [
    "inference-substrate.emitted",
    "inference-substrate.reconciled",
    "inference-substrate.briefing-rendered",
]
