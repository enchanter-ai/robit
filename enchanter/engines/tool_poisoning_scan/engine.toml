name = "tool-poisoning-scan"
description = "Required at post-response. M1 static scan + M6 EMA false-positive tracking for tool-poisoning patterns. Fail-closed veto when suspicion score meets threshold. Security plugin — never silenced."
version = "1.0.0"
phases = ["post-response"]
required = true
budget_tier = "always"
adapter = "enchanter.engines.tool_poisoning_scan.adapter:adapter"

[topics]
subscribes = ["mcp.tool.registered", "filesystem.write.completed"]
emits = ["tool-poisoning-scan.suspicion.flagged", "tool-poisoning-scan.sandbox.executed", "tool-poisoning-scan.rubric.verdict"]
