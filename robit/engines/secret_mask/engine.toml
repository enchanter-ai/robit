name = "secret-mask"
description = "Required at post-response. Redacts secrets found in tool results. Security plugin — never silenced. Mirrors scanResultAtPostResponse + maskSecrets from the TS hydra adapter."
version = "1.0.0"
phases = ["post-response"]
required = true
budget_tier = "always"
adapter = "robit.engines.secret_mask.adapter:adapter"

[topics]
subscribes = ["mcp.tool.result.received", "lifecycle.post-response"]
emits = ["secret-mask.matched"]
