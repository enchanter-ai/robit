name = "intent-anchor"
description = "Advisory intent anchoring and LCS drift detection. Captures first user prompt as session anchor; emits drift event when LCS ratio falls below threshold at post-session."
version = "1.0.0"
phases = ["anchor", "post-session"]
required = false
budget_tier = "med-or-higher"
adapter = "robit.engines.intent_anchor.adapter:adapter"

[topics]
subscribes = ["session.start", "user.prompt.submit", "compact.requested"]
emits = ["intent-anchor.anchor.set", "intent-anchor.drift.detected"]
