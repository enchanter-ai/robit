name = "cve-pattern-gate"
description = "Required at trust-gate. Fail-closed veto on critical CVE patterns. Severity-routed: critical vetoes, high/medium degrade, low informs."
version = "1.0.0"
phases = ["trust-gate"]
required = true
budget_tier = "always"
adapter = "robit.engines.cve_pattern_gate.adapter:adapter"

[topics]
subscribes = ["mcp.tool.call.requested", "lifecycle.trust-gate"]
emits = ["cve-pattern-gate.veto", "cve-pattern-gate.warn"]
