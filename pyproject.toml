[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enchanter-agent"
version = "0.5.0"
description = "Enforcement-first MCP-aware agent runtime. Port of the TypeScript MCP client architecture into Python with conduct injection and inference substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Enchanter Authors" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "orchestrator", "security", "enforcement"]

dependencies = [
    "anthropic>=0.40",
    "litellm>=1.40",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# The inspector lives under `enchanter-insights` (renamed in Wave 15.rename).
enchanter-insights = "enchanter.insights_cli:main"
# `enchanter` is the coding-agent CLI — Textual REPL with enchanter
# enforcement baked in. Wave 15.0 ships the foundation skeleton; Wave 15.1+
# extend it.
enchanter = "enchanter.agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enchanter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
