[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robit"
version = "0.7.0"
description = "Enforcement-first MCP-aware agent runtime. Port of the TypeScript MCP client architecture into Python with conduct injection and inference substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Robit Authors" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "orchestrator", "security", "enforcement"]

dependencies = [
    "anthropic>=0.40",
    "litellm>=1.40",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# The inspector binary is `insighter` (the inspector-side CLI). The
# inspector package lives at `robit.insighter`.
insighter = "robit.insighter:main"
# `robit` is the coding-agent CLI — Textual REPL with robit
# enforcement baked in. Wave 15.0 ships the foundation skeleton; Wave 15.1+
# extend it.
robit = "robit.agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
