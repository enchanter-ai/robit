[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enchanter-agent"
version = "0.1.0"
description = "Enforcement-first MCP-aware agent runtime. Port of the TypeScript MCP client architecture into Python with conduct injection and inference substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Enchanter Authors" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "orchestrator", "security", "enforcement"]

dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
enchanter = "enchanter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enchanter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
